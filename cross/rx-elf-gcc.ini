[binaries]
c     = 'rx-elf-gcc'
cpp   = 'rx-elf-g++'
ar    = 'rx-elf-ar'
strip = 'rx-elf-strip'
objcopy = 'rx-elf-objcopy'
objdump = 'rx-elf-objdump'
size  = 'rx-elf-size'

[built-in options]
c_args      = ['-misa=v3', '-fpu', '-ffunction-sections', '-fdata-sections', '-fno-common']
cpp_args    = ['-misa=v3', '-fpu', '-ffunction-sections', '-fdata-sections', '-fno-common']
c_link_args = ['-misa=v3', '-fpu', '-nostartfiles', '-nostdlib', '-Wl,--gc-sections']
cpp_link_args = ['-misa=v3', '-fpu', '-nostartfiles', '-nostdlib', '-Wl,--gc-sections']

[host_machine]
system = 'baremetal'
cpu_family = 'rx'
cpu = 'rx261'
endian = 'little'
